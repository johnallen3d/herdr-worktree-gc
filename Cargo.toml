[package]
name = "herdr-worktree-gc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Conservative cleanup of Herdr-managed Git worktrees"
license = "MIT"
publish = false
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/config.example.toml",
    "/herdr-plugin.toml",
]

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[[bin]]
name = "worktree-gc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.9"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3.20"
