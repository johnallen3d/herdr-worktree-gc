name: Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - Cargo.toml
      - Cargo.lock
      - herdr-plugin.toml
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: Existing draft release tag to rebuild
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      release_pending: ${{ steps.release.outputs.release_pending }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Create or recover draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          if [[ -n "$RECOVERY_TAG" ]]; then
            tag=$RECOVERY_TAG
          else
            output=$(mise exec -- release-plz release \
              --git-token "$GH_TOKEN" \
              --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --output json)
            tag=$(printf '%s' "$output" | mise exec -- yq -p=json -r '.releases[0].tag // ""')

            if [[ -z "$tag" ]]; then
              version=$(mise exec -- cargo metadata --no-deps --format-version 1 |
                mise exec -- yq -p=json -r '.packages[] | select(.name == "herdr-worktree-gc") | .version')
              tag="v$version"
            fi
          fi

          if release=$(mise exec -- gh release view "$tag" --json isDraft 2>/dev/null); then
            if [[ "$(printf '%s' "$release" | mise exec -- yq -p=json -r '.isDraft')" != "true" ]]; then
              echo "Release $tag is already published; nothing to build."
              echo 'release_pending=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            mise exec -- gh release create "$tag" --draft --generate-notes --verify-tag
          elif [[ -n "$RECOVERY_TAG" ]]; then
            echo "Recovery tag $tag does not exist." >&2
            exit 1
          else
            echo 'No release is pending.'
            echo 'release_pending=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          echo 'release_pending=true' >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.release_pending == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: mise run package -- "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: worktree-gc-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-assets:
    name: Publish release assets
    needs:
      - release
      - build
    if: needs.release.outputs.release_pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: worktree-gc-*
          path: dist
          merge-multiple: true
      - name: Upload archives to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: mise exec -- gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: mise exec -- gh release edit "$RELEASE_TAG" --draft=false --latest

  release-pr:
    name: Prepare next release
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Create or update release pull request
        id: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          output=$(mise exec -- release-plz release-pr \
            --git-token "$GITHUB_TOKEN" \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --output json)
          prs=$(printf '%s' "$output" | mise exec -- yq -p=json -o=json -I=0 '.prs')
          printf 'prs=%s\n' "$prs" >> "$GITHUB_OUTPUT"
          if [[ "$prs" == "[]" ]]; then
            echo 'prs_created=false' >> "$GITHUB_OUTPUT"
            echo 'pr={}' >> "$GITHUB_OUTPUT"
          else
            echo 'prs_created=true' >> "$GITHUB_OUTPUT"
            pr=$(printf '%s' "$prs" | mise exec -- yq -p=json -o=json -I=0 '.[0]')
            printf 'pr=%s\n' "$pr" >> "$GITHUB_OUTPUT"
          fi
      - name: Synchronize plugin manifest version
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_DATA: ${{ steps.release-pr.outputs.pr }}
        run: |
          pr_number=$(printf '%s' "$PR_DATA" | mise exec -- yq -p=json -o=json -I=0 -r '.number')
          version=$(printf '%s' "$PR_DATA" | mise exec -- yq -p=json -o=json -I=0 -r '.releases[0].version')
          mise exec -- gh pr checkout "$pr_number"
          mise run sync-plugin-version -- "$version"
          if git diff --quiet -- herdr-plugin.toml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herdr-plugin.toml
          git commit -m "chore: sync plugin manifest version"
          git push
      - name: Run CI for release pull request
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_DATA: ${{ steps.release-pr.outputs.pr }}
        run: |
          pr_number=$(printf '%s' "$PR_DATA" | mise exec -- yq -p=json -r '.number')
          head_ref=$(mise exec -- gh pr view "$pr_number" --json headRefName --jq '.headRefName')
          mise exec -- gh workflow run ci.yml --ref "$head_ref"
