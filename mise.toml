min_version = "2025.1.0"

[tools]
actionlint = "1.7.12"
gh = "2.101.0"
release-plz = "0.3.167"
rust = { version = "1.93.0", profile = "minimal", components = ["rustfmt", "clippy"] }
shellcheck = "0.11.0"
yq = "4.53.6"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --check"

[tasks.clippy]
description = "Run Clippy with pedantic lints"
run = "cargo clippy --locked --all-targets -- -D warnings -W clippy::pedantic"

[tasks.test]
description = "Run the Rust test suite"
run = "cargo test --locked"

[tasks.install-dev]
description = "Build and install the development binary"
run = '''
#!/usr/bin/env bash
set -euo pipefail

cargo build --release --locked
mkdir -p bin
install -m 755 target/release/worktree-gc bin/worktree-gc
printf 'Installed development binary at %s/bin/worktree-gc\n' "$PWD"
'''

[tasks.package]
description = "Build a release archive for a Rust target"
run = '''
#!/usr/bin/env bash
set -euo pipefail

case $# in
  0) target=$(rustc -vV | sed -n 's/^host: //p') ;;
  1) target=$1 ;;
  *)
    echo "usage: mise run package [rust-target]" >&2
    exit 2
    ;;
esac
name="worktree-gc-$target"
stage="dist/$name"
archive="dist/$name.tar.gz"

cargo build --release --locked --target "$target"
rm -rf "$stage"
mkdir -p "$stage/bin"
install -m 755 "target/$target/release/worktree-gc" "$stage/bin/worktree-gc"
cp herdr-plugin.toml config.example.toml README.md LICENSE "$stage/"
tar -C dist -czf "$archive" "$name"
printf '%s\n' "$archive"
'''

[tasks.workflow-lint]
description = "Lint GitHub Actions workflows"
run = "actionlint .github/workflows/*.yml"

[tasks.sync-plugin-version]
description = "Synchronize the Herdr plugin manifest version"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ $# -ne 1 || ! $1 =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
  echo "usage: mise run sync-plugin-version -- VERSION" >&2
  exit 2
fi
VERSION=$1 yq -i -p=toml -o=toml '.version = strenv(VERSION)' herdr-plugin.toml
'''

[tasks.check]
description = "Run all required checks"
depends = ["fmt", "clippy", "test", "workflow-lint"]
